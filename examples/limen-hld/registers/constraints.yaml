- id: K-01
  class: technical
  constraint: Python 3.9+ with PyYAML as the only third-party dependency.
  source: Repository convention; must run wherever the docs are checked out.
  negotiable: false
- id: K-02
  class: operational
  constraint: Must run with no network access.
  source: CI sandboxes and air-gapped review environments.
  negotiable: false
- id: K-03
  class: organizational
  constraint: One maintainer, no dedicated team.
  source: Project reality.
  negotiable: false
- id: K-04
  class: operational
  constraint: Advisory on code pull requests; blocking only on HLD pull requests.
  source: A validator that blocks every PR gets routed around within a quarter.
  negotiable: true
