- id: Q-01
  question: Should the declaration layer move from regex patterns to tree-sitter?
  matters_because: >
    Regex declaration patterns are per-language and will miss unusual
    formatting, which shows up as a false unresolved claim in G1.
  blocks: [L2.1]
  owner: "@maintainer"
  resolution_path: Measure the miss rate against a real multi-language repository.
  status: open
- id: Q-02
  question: Are the G3 similarity bands correct outside the test fixtures?
  matters_because: >
    HIGH_BAND and LOW_BAND were chosen against synthetic names; a real HLD may
    produce false near-duplicate findings and erode trust in the gate.
  blocks: [L2.6]
  owner: "@maintainer"
  resolution_path: Run G3 over this document and one real HLD; count false positives.
  status: open
- id: Q-03
  question: Where do audit records live once there is more than one HLD?
  matters_because: Audit history is the only record of what a reviewer verified.
  blocks: [L3.9]
  owner: "@maintainer"
  resolution_path: Decide when the second document set appears.
  status: open
